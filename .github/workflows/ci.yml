name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    # Windows n'est pas un extra : deux bugs du projet n'existaient que là (spawn d'un
    # .cmd refusé depuis Node 22, résolution du CLI de Vitest). Node 22 non plus :
    # c'est la version qui a introduit le refus. Les tests lancent de vrais runs Vitest.
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run compile
      - run: npm test
